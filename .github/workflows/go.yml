name: Test
on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: Install PDF support
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          else
            brew install poppler
          fi
      - run: go vet ./...
      - run: go test -timeout 5m ./...
      - run: go build -trimpath -o "$RUNNER_TEMP/themis" ./cmd/themis
      - run: '"$RUNNER_TEMP/themis" --version && "$RUNNER_TEMP/themis" capabilities --json'
